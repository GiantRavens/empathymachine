# empathy machine configuration
## choose a proxy address - use 127.0.0.1 for local-only, or 0.0.0.0 to listen on all interfaces for LAN clients
bind_addr: "0.0.0.0:8080"

## admin dashboard http server (local-only recommended)
admin_bind_addr: "127.0.0.1:8081"

## proxy tls fingerprint checking
proxy:
  fingerprint_blocked_connect: true

## define blocklists - each hosts-format file contributes domains to both the HTTP proxy and DNS sinkhole
## one entry per line, comments start with '#'
## use blocklists/custom.txt for local overrides (never overwritten), plus any subscribed lists you refresh

  # examples of popular hosts-format lists you can download:
  # - "blocklists/stevenblack_hosts"        # StevenBlack consolidated hosts
  # - "blocklists/oisd_basic.txt"          # OISD basic blocklist (ads + trackers)
  # - "blocklists/1hosts_pro.txt"          # 1Hosts Pro (privacy-focused)

# hosts that should bypass TLS interception (plain domains or wildcard prefixes like *.icloud.com)
# bypassed hosts are allowed through untouched, even if the DNS sinkhole is enabled
tls:
  bypass_hosts:
    - "gateway.icloud.com"
    - "ios.chat.openai.com"
    - "p141-contacts.icloud.com"
    - "p142-contacts.icloud.com"
    - "dns.quad9.net"
    - "unleash.codeium.com"
    - "ws.chatgpt.com"
    - "ab.chatgpt.com"
    - "p141-caldav.icloud.com"
    - "*.apple.com"
    - "*.githubusercontent.com"
    - "*.office.com"
    - "api.apple-cloudkit.com"
    - "*.atl-paas.net"
    - "*.atlassian.com"
    - "*.jira.com"

dns:
  enable: true
  # bind 127.0.0.1 for local-only DNS; switch to 0.0.0.0 to serve other devices on your LAN
  bind_addr: "0.0.0.0:8053"
  # all domains gathered from the blocklists above (local + subscribed) are answered with 0.0.0.0/:: here
  # allowed domains are forwarded to these upstream resolvers (supports udp/tcp/tls/https)
  upstreams:
    - address: "1.1.1.1:853"
      transport: tls
      dns_name: "cloudflare-dns.com"

blocklists:
  - "blocklists/custom.txt"
  - "blocklists/policy_imports.txt"

# optional remote sources EmpathyMachine can fetch and place into blocklists/
# each entry downloads from `url` and writes to `destination`
sources:
  - url:         "https://raw.githubusercontent.com/StevenBlack/hosts/refs/heads/master/hosts"
    destination: "blocklists/stevenblack_hosts.txt"
    # etag_path and last_modified_path default beside destination but can be overridden:
    # etag_path: "blocklists/stevenblack_hosts.txt.etag"
    # last_modified_path: "blocklists/stevenblack_hosts.txt.last_modified"

# specify on the fly rewrites for all sites, or by host names - watch indentation!
rewrites:
  remove:
    - "iframe"
    - "script[src*=\"consent.cookiebot.com\"]"
    - "script[src*=\"consentcdn.cookiebot.com\"]"
    - "iframe[src*=\"consentcdn.cookiebot.com\"]"
    - "link[href*=\"consent.cookiebot.com\"]"
    - "div#campaign-toaster"
    - "div.ad-slot"
    - "div.ad-slot-header__wrapper"
    - "div.cnx-front-player"
    # OneTrust cookie/privacy consent (used by CNN, Reuters, BBC, many news sites).
    # Both id-based — the previous "div.onetrust-banner-sdk" rule never matched
    # because OneTrust uses an id, not a class, and the wrapping element isn't always a div.
    - "#onetrust-banner-sdk"
    - "#onetrust-consent-sdk"
    - "#onetrust-pc-sdk"
    - ".onetrust-pc-dark-filter"
    # TrustArc and Quantcast — other common consent vendors that mount overlay UIs.
    - "#truste-consent-track"
    - "#truste-consent-content"
    - ".qc-cmp2-container"
    - ".qc-cmp2-summary-buttons"
    # (Admiral anti-adblock rules promoted to policy.yaml
    # presentation_policy.block_anti_adblock_walls — compiled into the
    # fenced managed region below by `mm policy compile`.)
    # === BEGIN policy.yaml managed (do not edit between markers) ===
    # from policy.yaml presentation_policy.block_anti_adblock_walls
    - 'script.pmc-admiral'
    - 'script[class="pmc-admiral"]'
    # === END policy.yaml managed ===

  css:
    # OneTrust — selectors now prefixed with '#' (ids), plus a body-class
    # rule to release the page scroll lock that OneTrust adds while open.
    - "#onetrust-banner-sdk { display: none !important; }"
    - "#onetrust-consent-sdk { display: none !important; }"
    - "#onetrust-pc-sdk { display: none !important; }"
    - ".onetrust-pc-dark-filter { display: none !important; }"
    - "body.ot-overflow-hidden { overflow: auto !important; height: auto !important; }"
    # TrustArc and Quantcast counterparts.
    - "#truste-consent-track, #truste-consent-content { display: none !important; }"
    - ".qc-cmp2-container, .qc-cmp2-summary-buttons { display: none !important; }"
    # (Admiral CSS fallback removed — compiled from policy.yaml below)
    # Pre-existing generic patterns — fixed: class selectors need a leading '.'.
    - ".cookie-banner { display: none !important; }"
    - ".paywall-overlay { display: none !important; }"
    - ".paywall-ui-responsive-modal { display: none !important; }"
    - "iframe { display: none !important; }"
    - ".wp-ad-wrapper { display: none !important; }"
    - "quantum-wrapper ad-slot-wrapper qtm-element { display: none !important; }"
    # ── Nuclear option: kill ALL ARIA modal dialogs site-wide.
    # Modals are ~95% cookie/paywall/newsletter junk. The rare legit modal
    # (Gmail compose, Google OAuth, SaaS settings dialogs) can be re-enabled
    # per-host by adding:
    #   hosts:
    #     mail.google.com:
    #       css:
    #         - 'div[role="dialog"][aria-modal="true"] { display: block !important; }'
    # CSS-only (no DOM remove) so per-host overrides can resurrect them.
    - 'div[role="dialog"][aria-modal="true"] { display: none !important; }'
    - '[role="dialog"][aria-modal="true"] { display: none !important; }'
    # The modal's translucent backdrop/scrim is usually a SEPARATE element,
    # so hiding the dialog leaves a full-page dim with nothing to click.
    # Kill the common backdrop patterns (Material UI, react-modal, generic).
    - '.MuiBackdrop-root { display: none !important; }'
    - '.ReactModal__Overlay { display: none !important; }'
    - '[class*="backdrop" i] { display: none !important; }'
    - '[class*="scrim" i] { display: none !important; }'
    - '[class*="modal-overlay" i] { display: none !important; }'
    # Native HTML <dialog> backdrop pseudo-element.
    - 'dialog::backdrop { display: none !important; }'
    # Release common body scroll locks that modal scripts apply.
    - 'body { overflow: auto !important; position: static !important; }'
    - 'body.modal-open, body.no-scroll, body.noscroll, body.fixed { overflow: auto !important; position: static !important; }'
    # === BEGIN policy.yaml managed (do not edit between markers) ===
    # from policy.yaml presentation_policy.block_anti_adblock_walls
    - "#DCDOr { display: none !important; }"
    - ".DCDOr { display: none !important; }"
    # === END policy.yaml managed ===

  replace:
    - find: "utilizes"
      replace: "uses"
    - find: "utilize"
      replace: "use"
    - find: "on-prem"
      replace: "on-site"
    - find: "On-Prem"
      replace: "On-Site"
    - find: "President Trump"
      replace: "White House Occupant"
    - find: "Trump"
      replace: "Orange Shitstain"
    - find: "Charlie Kirk"
      replace: "Right-Wing Agitator"
    - find: "CHARLIE KIRK"
      replace: "FASCIST AGITATOR"
    - find: "Steve Bannon"
      replace: "Rotting Zombie"

  hosts:
    www.quantum.com:
      remove:
        - "#CookiebotWidget"
      css:
        - "#CookiebotWidget { display: none !important; }"
    www.nytimes.com:
      remove:
        - 'iframe[src*="myaccount.nytimes.com/auth/iframe"]'
        - 'script[src*="myaccount.nytimes.com/auth"]'
    # CNN: the global CSS rule above hides the modal. On CNN specifically
    # we also DOM-remove BOTH the dialog and its translucent backdrop
    # (which CNN renders as a sibling div with aria-hidden="true").
    # Scoped to CNN because aria-hidden="true" is too broad to apply globally —
    # it's also used legitimately on decorative icons and screen-reader-hidden content.
    www.cnn.com: &cnn_rules
      remove:
        - 'div[role="dialog"][aria-modal="true"]'
        - 'div[aria-hidden="true"]'
      css:
        - 'div[aria-hidden="true"] { display: none !important; }'
    edition.cnn.com: *cnn_rules
    cnn.com: *cnn_rules

network_policy:
  block_quic: true